<script>const sb=supabase.createClient("https://qpttmgyarrbkeislithk.supabase.co","sb_publishable_tchHUmIdkeQ8_c5cQ2o1bA_GUg2plLK");const $=s=>document.querySelector(s);const say=(t,bad)=>{const m=$("#msg");m.textContent=t;m.style.color=bad?"#B3261E":"var(--ac)"};
